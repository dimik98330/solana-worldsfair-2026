[package]
name = "bondtrace"
version = "0.1.0"
description = "Permissioned corporate-action prototype for tokenized bonds"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bondtrace"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[dev-dependencies]
litesvm = "=0.9.1"
solana-account = "3"
solana-address = "2"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "3"
solana-signer = "3"
solana-transaction = "3"
bincode = "1.3"

[[test]]
name = "runtime"
path = "../../tests/program/runtime.rs"
